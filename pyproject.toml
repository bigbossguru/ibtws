[tool.poetry]
name = "ibtws"
version = "0.2.5"
description = ""
authors = ["Home Workstation <kursus1010@gmail.com>"]
packages = [{ include = "ibtws", from = "src" }]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
ib-async = {path = "libs/ib_async"}
ibapi = {path = "libs/twsapi/pythonclient"}
pandas = "^3.0.3"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.0"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
